name: veil-gateway

services:
  warp-init:
    build: ./warp
    image: veil-gateway-warp:local
    command: ["warp-init"]
    networks: [egress]
    volumes:
      - warp-data:/var/lib/warp

  warp:
    build: ./warp
    image: veil-gateway-warp:local
    restart: unless-stopped
    depends_on:
      warp-init:
        condition: service_completed_successfully
    networks:
      egress: {}
      socks:
        ipv4_address: 10.0.89.4
    volumes:
      - warp-data:/var/lib/warp
      - ./warp/resolv.conf:/etc/resolv.conf:ro
    healthcheck:
      test: ["CMD", "timeout", "15", "tunnel-check"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  privoxy:
    build: ./privoxy
    image: veil-gateway-privoxy:local
    restart: unless-stopped
    networks: [edge, socks]
    ports:
      - "0.0.0.0:8118:8118"
    depends_on: [warp]

networks:
  egress: {}
  edge:
    driver_opts:
      com.docker.network.bridge.name: veil-edge
  socks:
    internal: true
    ipam:
      config:
        - subnet: 10.0.89.0/29

volumes:
  warp-data: {}
